<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achmad Rivaldi Zulfah — AI Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --main: #2563EB;
    --text: #0A0A0A;
    --bg: #FAFAFA;
    --accent: #10B981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    max-width: 560px;
    text-align: left;
  }
  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 12px;
  }
  h1 span { color: var(--main); }
  p.claim {
    font-size: 1rem;
    line-height: 1.6;
    color: #333;
    margin-bottom: 28px;
  }
  .status {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 10px;
    border-radius: 4px;
    margin-bottom: 28px;
  }
  a.cta {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    background: var(--main);
    color: #fff;
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  a.cta:hover { opacity: 0.9; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="status">portfolio sedang dibangun</div>
    <h1>Achmad Rivaldi Zulfah — <span>AI Engineer</span></h1>
    <p class="claim">Saya membangun sistem software dan model ML yang benar-benar berjalan di dunia nyata — dari automation pipeline production-ready sampai riset NLP formal untuk sentiment analysis bahasa Indonesia.</p>
    <a class="cta" href="mailto:achmadrivaldizulfah@gmail.com">Hubungi saya →</a>
  </div>
</body>
</html>
